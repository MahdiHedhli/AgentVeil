[package]
name = "agentveil"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MahdiHedhli/AgentVeil"
description = "Keep sensitive data out of Codex context."

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
blake3 = "1.8"
bytes = "1.11"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.52", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
pretty_assertions = "1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
