[package]
name = "agentveil"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MahdiHedhli/AgentVeil"
description = "Keep sensitive data out of Codex context."

[dependencies]
base64 = "0.22"
blake3 = "1.8"
getrandom = "0.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = "2.0"
unicode-normalization = "0.1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
pretty_assertions = "1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
